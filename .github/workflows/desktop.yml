name: Build desktop apps

# Builds the Windows and Mac installers on GitHub's own machines (free for public repositories).
# Run it by hand from the Actions tab (it asks for a version name such as v1.0.0 and publishes a Release),
# or push a version tag such as v1.0.0 to do the same.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release name, for example v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The installer file names carry the release version, so set it before building.
      - name: Set app version from the release name
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The Windows app updates itself from latest.yml, so the release must carry it.
      - name: Check the Windows update file exists
        if: matrix.os == 'windows-latest'
        shell: bash
        run: test -f release/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: autosmm-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Use this version's section of CHANGELOG.md as the release notes, if there is one.
      - name: Write release notes
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## /{on=0} on' CHANGELOG.md > release-notes.md || true
          if [ -s release-notes.md ]; then echo "NOTES=release-notes.md" >> "$GITHUB_ENV"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: dist/*
          body_path: ${{ env.NOTES }}
          generate_release_notes: ${{ env.NOTES == '' }}

  # Point the README download buttons at the files of the release that was just published.
  readme:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update download links
        run: |
          export VERSION="${TAG#v}"
          perl -pi -e 's{releases/(?:latest/download|download/[^/]+)/}{releases/download/$ENV{TAG}/}g; s{AutoSMM-Setup-(?:[\d.]+-)?windows-}{AutoSMM-Setup-$ENV{VERSION}-windows-}g; s{AutoSMM-Portable-(?:[\d.]+-)?windows-}{AutoSMM-Portable-$ENV{VERSION}-windows-}g; s{AutoSMM-(?:[\d.]+-)?mac-}{AutoSMM-$ENV{VERSION}-mac-}g' README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Point download buttons at $TAG" && git push origin HEAD:main)
